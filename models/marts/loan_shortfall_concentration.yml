version: 2
models:
  - name: agg_loan_shortfall_concentration
    description: >
      One row per observed month and nonzero change direction. Fewest ordinal
      ranked accounts covering at least 80% of that direction's gross magnitude.
      This is a fixed descriptive review threshold, not a treatment policy.
      Absent directions remain absent, not zero-population observations.
    columns:
      - name: snapshot_date
        tests: [not_null]
      - name: change_direction
        tests: [not_null]
      - name: accounts_to_review_threshold
        tests: [not_null]
