version: 2
models:
  - name: dim_customer
    description: "Customer reporting dimension with a readable full name."
    columns:
      - name: customer_id
        description: "Stable synthetic customer identifier."
        tests: [not_null, unique]
      - name: full_name
        description: "First and last name combined for reporting."
        tests: [not_null]
      - name: date_of_birth
        description: "Customer date of birth."
        tests: [not_null]
      - name: postcode
        description: "Synthetic customer postcode."
        tests: [not_null]
  - name: dim_loan
    description: "One row per loan account with completed-payment summaries."
    columns:
      - name: account_id
        description: "Stable synthetic loan account identifier."
        tests: [not_null, unique]
      - name: customer_id
        description: "Customer associated with the loan."
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'customers')
                field: customer_id
      - name: product_code
        description: "Synthetic loan product code."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['LOAN-A', 'LOAN-B', 'LOAN-C']
      - name: origination_date
        description: "Date the loan was originated."
        tests: [not_null]
      - name: loan_age_months
        description: "Completed calendar months from origination to the fixed run date."
        tests:
          - not_null
      - name: original_balance
        description: "Original loan balance."
        tests: [not_null]
      - name: status
        description: "Loan status at the point represented by the generated data."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Open', 'Pending', 'Closed']
      - name: completed_payment_count
        description: "Number of completed payment attempts for the account."
        tests: [not_null]
      - name: completed_payment_amount
        description: "Total amount from completed payment attempts."
        tests: [not_null]
  - name: fct_payment
    description: "One row per payment attempt, retaining failed attempts."
    columns:
      - name: payment_id
        description: "Stable synthetic payment identifier."
        tests: [not_null, unique]
      - name: account_id
        description: "Loan account associated with the payment."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_loan')
                field: account_id
      - name: payment_date
        description: "Date of the payment attempt."
        tests: [not_null]
      - name: amount
        description: "Payment amount."
        tests: [not_null]
      - name: payment_status
        description: "Whether the payment attempt completed or failed."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Completed', 'Failed']
      - name: payment_method
        description: "Method used for the payment attempt."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Direct Debit', 'Card', 'Bank Transfer']
      - name: is_successful
        description: "Boolean flag derived from payment_status."
        tests: [not_null]
  - name: dim_subscription
    description: "One row per subscription agreement with reporting attributes as at the fixed run date."
    columns:
      - name: subscription_id
        description: "Stable synthetic subscription identifier."
        tests: [not_null, unique]
      - name: customer_id
        description: "Customer associated with the subscription."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_code
        description: "Synthetic subscription product code."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['SUB-1', 'SUB-2']
      - name: start_date
        description: "Date the subscription agreement started."
        tests: [not_null]
      - name: months_since_start
        description: "Completed calendar months from start date to the fixed run date."
        tests: [not_null]
      - name: billing_frequency
        description: "Contracted billing frequency; it is not treated as evidence of a payment."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Monthly', 'Annual']
      - name: status
        description: "Subscription status represented by the generated source row."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Active', 'Cancelled']
      - name: is_active
        description: "Boolean flag derived from status; no point-in-time history is implied."
        tests: [not_null]
