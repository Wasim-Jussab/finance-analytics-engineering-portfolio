version: 2
sources:
  - name: raw
    description: "Typed tables loaded from the generated CSV files."
    schema: raw
    loaded_at_field: loaded_at
    freshness:
      warn_after: {count: 1, period: hour}
      error_after: {count: 24, period: hour}
    tables:
      - name: subscription_plans
        description: "Four synthetic product and billing-frequency plan definitions."
      - name: customers
        description: "One row per synthetic customer."
      - name: loans
        description: "One row per synthetic loan account."
      - name: payments
        description: "One row per payment attempt, including failed attempts."
      - name: subscriptions
        description: "One row per synthetic subscription."
      - name: subscription_payments
        description: "One row per scheduled synthetic subscription payment attempt."
      - name: run_parameters
        description: "One row containing the fixed as-of date for the run."
