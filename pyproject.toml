
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-analytics-engineering-portfolio"
version = "0.1.0"
description = "A synthetic, local-first finance analytics engineering portfolio."
requires-python = ">=3.11"
readme = "README.md"
authors = [
    { name = "Wasim Jussab" }
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.setuptools.packages.find]
where = ["src"]
