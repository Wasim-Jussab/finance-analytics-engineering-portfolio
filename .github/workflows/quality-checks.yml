name: quality-checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run the complete quality gate
        run: |
          make verify
          test ! -e reports/pipeline.lock

      - name: Preserve completed pipeline evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/latest-pipeline-run.json
            reports/runs/*.json
          if-no-files-found: warn
          retention-days: 7
